<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta property="og:image" content="https://__DOMAIN__/og-image.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:locale" content="ar_AR"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://__DOMAIN__/og-image.png"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اتصل بنا – حوّل ملفك</title><meta name="description" content="تواصل مع فريق حوّل ملفك للدعم أو الاقتراحات.">
<!-- ضع كود AdSense هنا (داخل head) بعد التسجيل في أدسنس -->
<style>:root{--bg:#f6f4ff;--c:#fff;--tx:#1d1b3a;--m:#6b6890;--p:#6c4cf5;--b:#d9d3fa;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14122b;--c:#1e1b3d;--tx:#f1efff;--m:#a9a5d0;--b:#3b3768}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.9 Tajawal,Tahoma,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 16px}.top{font-weight:800;font-size:1.2rem}.top a{color:var(--p);text-decoration:none}
article{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:18px 20px;margin-top:12px}
h1{font-size:1.6rem;margin:0 0 4px}h2{font-size:1.1rem;margin:22px 0 4px;color:var(--p)}p,li{color:var(--tx)}small{color:var(--m)}a{color:var(--p)}
input,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--tx);margin:4px 0 12px}
button.s{font:inherit;font-weight:800;border:0;border-radius:10px;padding:8px 22px;color:#fff;background:var(--p);cursor:pointer}</style>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="/config.js" defer></script><script src="/site.js" defer></script></head>
<body><main><div class="top"><a href="/" style="display:inline-flex;align-items:center;gap:8px"><img src="/logo.svg" width="30" height="30" alt="شعار حوّل ملفك">حوّل ملفك</a></div><article><h1>اتصل بنا</h1>
<p>يسعدنا سماعك. للدعم أو الاقتراحات أو الإبلاغ عن مشكلة:</p>
<p data-row>📧 البريد: <a data-s="email"></a></p>
<p data-row>💬 واتساب / هاتف: <a data-s="phone" dir="ltr"></a></p>
<p data-row>📍 <span data-s="city"></span></p>
<p data-row>⏱ نرد على الرسائل <span data-s="hours"></span></p>
<h2>أرسل رسالة</h2>
<form id="f"><label>الاسم<input id="n" required></label><label>البريد الإلكتروني<input id="e" type="email" required></label><label>رسالتك<textarea id="m" rows="5" required></textarea></label><button class="s">إرسال</button></form>
<small>عند الإرسال يفتح تطبيق البريد عندك برسالة جاهزة تُرسل إلى بريد الدعم.</small>
<script>f.onsubmit=e=>{e.preventDefault();location.href='mailto:'+SITE.email+'?subject='+encodeURIComponent('رسالة من '+n.value)+'&body='+encodeURIComponent(m.value+'\n\n'+n.value+' - '+document.getElementById('e').value)}</script></article></main></body></html>
