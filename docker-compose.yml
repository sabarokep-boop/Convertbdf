services:
  app:
    build: .
    restart: unless-stopped
    environment: [MAX_MB=50, CONCURRENCY=2]
    mem_limit: 2g
    tmpfs: ["/tmp:size=1g"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80","443:443"]
    environment: [DOMAIN=${DOMAIN}]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile","caddy_data:/data"]
    depends_on: [app]
volumes:
  caddy_data:
